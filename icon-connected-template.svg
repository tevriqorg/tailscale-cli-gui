<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 3x3 grid of dots (r=4.56) -->
  <!-- Row 1: 1, 2, 3 -->
  <circle cx="16" cy="16" r="4.56" fill="black"/>
  <circle cx="32" cy="16" r="4.56" fill="black" fill-opacity="0.4"/>
  <circle cx="48" cy="16" r="4.56" fill="black" fill-opacity="0.4"/>
  <!-- Row 2: 4, 5, 6 -->
  <circle cx="16" cy="32" r="4.56" fill="black"/>
  <circle cx="32" cy="32" r="4.56" fill="black"/>
  <circle cx="48" cy="32" r="4.56" fill="black"/>
  <!-- Row 3: 7, 8, 9 -->
  <circle cx="16" cy="48" r="4.56" fill="black"/>
  <circle cx="32" cy="48" r="4.56" fill="black"/>
  <circle cx="48" cy="48" r="4.56" fill="black" fill-opacity="0.4"/>

  <!-- Caret: connect 1 -> 5 -> 7 -->
  <line x1="16" y1="16" x2="32" y2="32" stroke="black" stroke-width="9.12"/>
  <line x1="32" y1="32" x2="16" y2="48" stroke="black" stroke-width="9.12"/>
</svg>
